name: フォークの申請
description: Org の中にフォークを作る申請。管理者が承認すると自動で作られる
title: "フォークの申請："
labels: ["fork-request"]
body:
  - type: input
    id: source
    attributes:
      label: フォーク元のリポジトリ
      description: この Org の中のリポジトリの名前だけを書く（例：source-repo）
    validations:
      required: true
  - type: input
    id: fork_name
    attributes:
      label: フォークの名前
      description: フォーク元の名前に用途を付ける（例：source-repo_1ROM）。英数字・ハイフン・下線・ピリオドだけ
    validations:
      required: true
  - type: input
    id: base_ref
    attributes:
      label: 起点のブランチかタグ
      description: フォーク元のブランチ名かタグ名（例：IT6_2.9.1_20260803_G00-V1-00）。新しいフォークに同じ名前で写す
    validations:
      required: true
  - type: input
    id: work_branch
    attributes:
      label: 作業のブランチの名前
      description: 起点の版から始まるブランチを、この名前で新しいフォークに作る（例：1rom/eagle）。起点がタグのときは必須
    validations:
      required: false
  - type: textarea
    id: purpose
    attributes:
      label: 用途
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: 権限を付けるチーム
      description: この Org のチームの名前（例：reviewers）。書き込みの権限を付ける
    validations:
      required: true
  - type: dropdown
    id: requester_role
    attributes:
      label: 申請者に付ける権限
      options:
        - maintain
        - admin
    validations:
      required: true
  - type: input
    id: expires
    attributes:
      label: 使う期限
      description: YYYY-MM-DD
    validations:
      required: true
